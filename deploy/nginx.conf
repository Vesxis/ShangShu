resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    http http;
    https https;
}

upstream shangshu_api {
    zone shangshu_api 64k;
    server backend_system_app:8000 resolve;
}

upstream shangshu_frontend {
    zone shangshu_frontend 64k;
    server frontend:3000 resolve;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        proxy_pass http://shangshu_api/;
        proxy_read_timeout 90s;
    }

    location /ws/ {
        proxy_pass http://shangshu_api;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://shangshu_frontend;
    }
}
