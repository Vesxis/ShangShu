name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    env:
      DB_USER: root
      DB_PASSWORD: test_password
      DB_NAME: test_db
      DB_HOST: localhost
      DB_PORT: 3306
      SECRET_KEY: test-secret-key
      REDIS_URL: redis://localhost:6379
      RABBITMQ_URL: amqp://guest:guest@localhost:5672/

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest_password"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
      rabbitmq:
        image: rabbitmq:3
        ports:
          - 5672:5672

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Migrations
        run: alembic upgrade head

      - name: Models match migrations
        run: alembic check

      - name: Migration round trip
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend-main/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm run build -- --webpack
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_WS_URL: ""
          NEXT_TELEMETRY_DISABLED: "1"

  deploy:
    needs: [lint, test, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_EC2_DEPLOY == 'true'
    runs-on: ubuntu-latest
    env:
      EC2_APP_DIR: ${{ vars.EC2_APP_DIR || '/home/ubuntu/ShangShu' }}
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: EC2_APP_DIR
          script: |
            set -e
            cd "$EC2_APP_DIR"
            git pull --ff-only origin main
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
